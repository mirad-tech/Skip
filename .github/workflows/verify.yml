name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # JVM unit tests: protected-package matching, scan-miss classification, node-scan budget,
      # policy merge rules and update-version comparison.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Version metadata consistency
        shell: pwsh
        run: |
          $gradle = Get-Content -LiteralPath 'app/build.gradle.kts' -Raw
          $versionCode = [regex]::Match($gradle, 'versionCode\s*=\s*(\d+)').Groups[1].Value
          $versionName = [regex]::Match($gradle, 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $versionCode -or -not $versionName) {
            throw 'app/build.gradle.kts 中缺少 versionCode / versionName'
          }
          ./tools/verify-release.ps1 -Version $versionName -VersionCode ([int]$versionCode) -CheckVersionOnly

      - name: Signing material must stay untracked
        run: |
          for path in keystore.properties release.keystore local.properties; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked by git"
              exit 1
            fi
          done
          echo "No signing material is tracked."

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skip-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
